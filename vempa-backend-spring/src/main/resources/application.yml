server:
  port: ${PORT:3000}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # update: crea/ajusta tablas automáticamente a partir de las entidades.
      # Cómodo para desarrollo académico; en un proyecto productivo real se
      # preferirían migraciones versionadas (Flyway/Liquibase).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

vempa:
  jwt:
    secret: ${JWT_SECRET:VmVtcGFBcHBTZWNyZXRLZXlQYXJhUHJvZHVjY2lvbjIwMjY=}
    # Tiempo de vida del token: pasado este tiempo, el token deja de ser válido
    # aunque no se haya cerrado sesión, y el usuario debe volver a loguearse.
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}
  bcrypt:
    strength: ${BCRYPT_STRENGTH:12}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
